<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Sklarz Creative Content Engine</title><desc id="desc">A four-step editorial process: investigate, explain, apply, and build.</desc><rect width="1200" height="800" rx="42" fill="#F7F8FA"/><g font-family="Arial,sans-serif"><text x="70" y="90" font-size="22" font-weight="700" letter-spacing="4" fill="#C9A84C">EDITORIAL SYSTEM</text><text x="70" y="145" font-size="46" font-weight="700" fill="#1A2F4B">Investigate. Explain. Apply. Build.</text><g transform="translate(80 240)"><g><rect width="230" height="330" rx="26" fill="#102136"/><text x="30" y="58" font-size="18" font-weight="700" fill="#E1CA83">01</text><text x="30" y="120" font-size="28" font-weight="700" fill="#fff">INVESTIGATE</text><text x="30" y="165" font-size="16" fill="#dce3ea">Find the real question.</text><circle cx="115" cy="245" r="52" fill="none" stroke="#C9A84C" stroke-width="3"/><path d="M145 278l42 42" stroke="#C9A84C" stroke-width="8" stroke-linecap="round"/></g><g transform="translate(270)"><rect width="230" height="330" rx="26" fill="#1A2F4B"/><text x="30" y="58" font-size="18" font-weight="700" fill="#E1CA83">02</text><text x="30" y="120" font-size="28" font-weight="700" fill="#fff">EXPLAIN</text><text x="30" y="165" font-size="16" fill="#dce3ea">Translate complexity.</text><path d="M58 225h115M58 250h90M58 275h125" stroke="#C9A84C" stroke-width="7" stroke-linecap="round"/></g><g transform="translate(540)"><rect width="230" height="330" rx="26" fill="#C9A84C"/><text x="30" y="58" font-size="18" font-weight="700" fill="#102136">03</text><text x="30" y="120" font-size="28" font-weight="700" fill="#102136">APPLY</text><text x="30" y="165" font-size="16" fill="#102136">Turn insight into action.</text><path d="M62 255l34 34 74-90" fill="none" stroke="#102136" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(810)"><rect width="230" height="330" rx="26" fill="#E1CA83"/><text x="30" y="58" font-size="18" font-weight="700" fill="#102136">04</text><text x="30" y="120" font-size="28" font-weight="700" fill="#102136">BUILD</text><text x="30" y="165" font-size="16" fill="#102136">Create durable assets.</text><rect x="62" y="210" width="45" height="90" fill="#102136"/><rect x="122" y="180" width="45" height="120" fill="#102136"/><rect x="182" y="145" width="20" height="155" fill="#102136"/></g></g><text x="80" y="690" font-size="19" fill="#626B77">Research becomes useful when it changes what someone can understand, decide, or do next.</text></g></svg>