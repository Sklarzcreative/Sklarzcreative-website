name: Standardize LinkedIn URL
on:
  push:
    paths: ['.github/workflows/linkedin-url.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace LinkedIn URL
        run: |
          grep -rl 'https://www.linkedin.com/in/cassandra-sklarz-762738179' --include='*.html' . | xargs -r sed -i 's#https://www.linkedin.com/in/cassandra-sklarz-762738179#https://www.linkedin.com/in/cassandra-sklarz#g'
          git config user.name "Sklarz Creative Site QA"
          git config user.email "actions@users.noreply.github.com"
          git add '*.html' 'insights/**/*.html' || true
          if ! git diff --cached --quiet; then git commit -m "Use confirmed Cassandra Sklarz LinkedIn URL" && git push; fi
