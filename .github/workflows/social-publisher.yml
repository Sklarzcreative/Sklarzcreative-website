name: Sklarz Social Publisher

on:
  pull_request:
    paths:
      - "automation/social-publisher/**"
      - ".github/workflows/social-publisher.yml"
  push:
    branches: [main]
    paths:
      - "automation/social-publisher/**"
      - ".github/workflows/social-publisher.yml"
  schedule:
    # Offset from the top of the hour to reduce GitHub cron congestion.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      live:
        description: "Allow live publishing for this manual run"
        type: boolean
        default: false
      publish_id:
        description: "Optional exact Publish ID"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sklarz-social-publisher
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation/social-publisher
    env:
      PYTHONPATH: ${{ github.workspace }}/automation/social-publisher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/social-publisher/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  publish:
    if: >-
      (github.event_name == 'schedule' && vars.SOCIAL_PUBLISHER_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation/social-publisher
    env:
      PYTHONPATH: ${{ github.workspace }}/automation/social-publisher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/social-publisher/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run publisher
        env:
          PUBLISHER_ENABLED: ${{ github.event_name == 'schedule' && 'true' || inputs.live }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.live != true && 'true' || 'false' }}
          TIMEZONE: America/New_York
          MAX_POSTS_PER_RUN: "1"
          MAX_BACKLOG_MINUTES: "120"
          SHEET_ID: 1DQ_2ThldqZjh_rqMSh8LkzZeUFZaCr5PtRZBgmbggbk
          WORKSHEET_NAME: MAKE - Publish Queue
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_ORGANIZATION_URN: ${{ secrets.LINKEDIN_ORGANIZATION_URN }}
          LINKEDIN_VERSION: "202608"
          META_GRAPH_VERSION: v24.0
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_BASE_URL: ${{ secrets.MASTODON_BASE_URL }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
        run: >-
          python -m social_publisher.main
          ${{ inputs.publish_id && format('--publish-id {0}', inputs.publish_id) || '' }}
